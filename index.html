<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafarGo – Hotel Booking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
<style>
:root{--c:#2C0901;--cr:#FFF4E8;--tan:#C9A27A;--c2:#5a2a1c;--w:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--cr);color:var(--c);line-height:1.55}
h1,h2,h3,.logo,button,.btn,label,nav a{font-family:'Segoe UI',system-ui,sans-serif}
p,li,small{font-family:'Segoe UI',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{position:absolute;inset:0 0 auto;z-index:5;color:var(--cr)}
header.solid{position:static;background:var(--c)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:22px;padding-bottom:22px}
.logo{font-size:1.7rem;font-weight:800;letter-spacing:.5px}.logo b{color:var(--tan)}
nav a{margin-left:26px;font-size:.95rem;opacity:.9}nav a.on,nav a:hover{border-bottom:2px solid var(--tan)}
.hero{min-height:620px;background:linear-gradient(180deg,rgba(44,9,1,.55),rgba(44,9,1,.85)),url('images/hero.jpg') center/cover no-repeat;color:var(--cr);display:flex;align-items:center;padding:120px 0 150px}
.hero h1{font-size:clamp(2.2rem,5.5vw,4rem);line-height:1.1;max-width:640px;text-transform:uppercase}
.hero p{max-width:480px;margin:18px 0 26px;opacity:.9}
.btn{display:inline-block;background:var(--c);color:var(--cr);border:0;border-radius:12px;padding:13px 26px;font-size:1rem;font-weight:600;cursor:pointer}
.btn:hover{background:var(--c2)}.btn.alt{background:var(--tan);color:var(--c)}.btn.out{background:transparent;border:1.5px solid var(--c);color:var(--c)}
.search{background:var(--w);border-radius:24px;box-shadow:0 18px 50px rgba(44,9,1,.25);padding:26px;margin:-90px auto 0;position:relative;z-index:3;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
label{font-size:.8rem;font-weight:700;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #e4cdb4;border-radius:12px;background:var(--cr);color:var(--c);font:inherit;font-family:'Segoe UI',sans-serif}
section{padding:70px 0}
.title{text-align:center;margin-bottom:34px}.title h2{font-size:2rem;text-transform:uppercase;letter-spacing:1px}.title p{opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:24px}
.card{background:var(--w);border-radius:22px;overflow:hidden;box-shadow:0 8px 26px rgba(44,9,1,.1);display:flex;flex-direction:column}
.img{height:200px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:14px;color:var(--cr);font-size:2.4rem}
.img span.r{position:absolute;top:12px;right:12px;background:var(--cr);color:var(--c);border-radius:20px;padding:3px 11px;font:700 .85rem 'Segoe UI'}
.body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:1.2rem}.muted{opacity:.7;font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags i{font-style:normal;font-size:.75rem;background:var(--cr);padding:3px 10px;border-radius:20px}
.row{display:flex;gap:10px;margin-top:auto;padding-top:8px;align-items:center;justify-content:space-between}
.price{font:800 1.25rem 'Segoe UI'}.price small{font-weight:400;opacity:.7}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
.dest a{height:220px;border-radius:22px;color:var(--cr);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;font-family:'Segoe UI',sans-serif;transition:.2s}
.dest a:hover{transform:translateY(-5px)}.dest b{font-size:1.25rem}
.why{background:var(--c);color:var(--cr);border-radius:28px;padding:44px 24px}
.why .grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.why .it{background:rgba(255,244,232,.08);border-radius:18px;padding:22px;text-align:center}.why .it div{font-size:2rem}
.rev{padding:22px}.rev p{margin:8px 0}
footer{background:var(--c);color:var(--cr);padding:44px 0 24px;margin-top:40px}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
footer p,footer a{opacity:.8;display:block;margin:4px 0;font-size:.92rem}
.copy{text-align:center;opacity:.6;margin-top:28px;font-size:.85rem}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:30px}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:12px}.gal div{border-radius:20px;min-height:150px;background-size:cover}.gal .big{grid-row:span 2;min-height:310px}
.panel{background:var(--w);border-radius:22px;padding:24px;box-shadow:0 8px 26px rgba(44,9,1,.1)}
.panel h3{margin-bottom:12px}.f{margin-bottom:14px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e4cdb4;font-family:'Segoe UI',sans-serif}
.sum .t{font-weight:800;font-size:1.15rem;border:0}
.err{color:#b3261e;font:.85rem 'Segoe UI';margin:8px 0}
.ok{width:72px;height:72px;border-radius:50%;background:var(--c);color:var(--cr);display:grid;place-items:center;font-size:2.2rem;margin:0 auto 14px}
.pg{padding-top:40px;min-height:60vh}
@media(max-width:820px){.two{grid-template-columns:1fr}nav a{margin-left:14px;font-size:.88rem}.hero{padding-top:100px}.gal{grid-template-columns:1fr}.gal .big{grid-row:auto}}
@media(max-width:480px){.f2{grid-template-columns:1fr}.logo{font-size:1.4rem}}
</style></head><body>
<header id="hd"><div class="wrap"><a class="logo" href="#/">Safar<b>Go</b></a>
<nav><a href="#/" data-n="home">Home</a><a href="#/hotels" data-n="hotels">Hotels</a></nav></div></header>
<main id="app"></main>
<footer><div class="wrap"><div><div class="logo">Safar<b>Go</b></div><p>Stay beautifully across Pakistan.</p></div>
<div><b>Quick Links</b><a href="#/">Home</a><a href="#/hotels">All Hotels</a></div>
<div><b>Contact</b><p>support@safargo.example</p><p>+92 300 0000000</p></div></div>
<div class="copy">© 2026 SafarGo. All rights reserved.</div></footer>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=window.SAFARGO_CONFIG||{};
let sb=null;
try{if(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&window.supabase)sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY)}catch(e){console.warn('Supabase init failed',e)}
const R=[['Ayesha K.',5,'Spotless rooms and wonderful staff. Booking was effortless.'],['Hamza R.',4,'Great location and breakfast. Would stay again.'],['Sana M.',5,'Felt truly premium for the price. Highly recommended.']];
const mk=(id,name,city,loc,rating,price,rv,desc,fac,g,ic,rooms)=>({id,name,city,location:loc,rating,price,reviews:rv,description:desc,facilities:fac,grad:g,icon:ic,rooms});
let HOTELS=[
mk('lhr-1','Haveli Royale','Lahore','Walled City, Lahore',4.8,28000,214,'A restored heritage haveli with courtyard dining steps from Badshahi Mosque.',['WiFi','Breakfast','Parking','Spa'],'#8a4b2b,#2C0901','🕌',[['Deluxe Room',28000],['Heritage Suite',42000]]),
mk('isb-1','Margalla Grand','Islamabad','F-6, Islamabad',4.7,32000,305,'Modern luxury at the foot of the Margalla Hills with a rooftop pool.',['WiFi','Pool','Gym','Breakfast'],'#6d7a5a,#2C0901','⛰️',[['Superior Room',32000],['Executive Suite',55000]]),
mk('khi-1','Seaview Residency','Karachi','Clifton, Karachi',4.5,24000,178,'Bright rooms a short walk from the beach, with a seafood restaurant.',['WiFi','Restaurant','Parking','AC'],'#3b7a8a,#2C0901','🌊',[['City Room',24000],['Sea View Room',31000]]),
mk('mry-1','Pine Crest Lodge','Murree','Mall Road, Murree',4.6,18000,142,'Cosy mountain lodge with fireplace lounges and valley views.',['WiFi','Heater','Breakfast','Parking'],'#4f6b4a,#2C0901','🌲',[['Cozy Room',18000],['Family Cottage',30000]]),
mk('hnz-1','Karimabad Mountain Inn','Hunza','Karimabad, Hunza',4.9,22000,260,'Wake up to Rakaposhi views at this warm family-run inn.',['WiFi','Breakfast','Terrace','Heater'],'#9a7b5a,#2C0901','🏔️',[['Valley Room',22000],['Panorama Suite',36000]]),
mk('swt-1','Swat Riverside Resort','Swat','Madyan, Swat',4.4,16000,119,'Riverside cabins surrounded by orchards and mountain streams.',['WiFi','Restaurant','Garden','Parking'],'#4a7a6a,#2C0901','🌿',[['River Cabin',16000],['Deluxe Cabin',24000]])];
const IMG={'lhr-1':'images/haveli-royale.jpeg','isb-1':'images/margalla-grand.jpeg','khi-1':'images/seaview-residency.jpeg'};
const CITY={Lahore:'images/lahore.jpeg',Islamabad:'images/islamabad.jpeg',Karachi:'images/karachi.jpeg',Murree:'images/murree.jpeg',Hunza:'images/hunza.jpeg',Swat:'images/swat.jpeg'};
HOTELS.forEach(h=>h.image=IMG[h.id]||CITY[h.city]);
const bg=h=>h.image?`linear-gradient(rgba(44,9,1,.1),rgba(44,9,1,.45)),url('${encodeURI(h.image).replace(/'/g,'%27')}')`:`linear-gradient(160deg,${h.grad.split(',')[0]},${h.grad.split(',')[1]})`;
const cbg=(c,h)=>CITY[c]?`linear-gradient(180deg,rgba(44,9,1,0) 35%,rgba(44,9,1,.85)),url('${CITY[c]}')`:bg(h);
const rs=(n)=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const pk=n=>'PKR '+Number(n).toLocaleString('en-PK');
const get=id=>HOTELS.find(h=>h.id===id);
async function loadHotels(){
 if(!sb)return;
 try{const{data,error}=await sb.from('hotels').select('*');if(error)throw error;
  if(data&&data.length)HOTELS=data.map(d=>({id:d.id,name:d.name,city:d.city,location:d.location,rating:+d.rating,price:+d.price_per_night,reviews:d.review_count,description:d.description,facilities:d.facilities||[],grad:d.gradient||'#8a4b2b,#2C0901',icon:'🏨',image:d.image_url||IMG[d.id]||CITY[d.city],rooms:d.rooms||[['Standard Room',+d.price_per_night]]}))
 }catch(e){console.warn('Using local hotel data:',e.message)}
}
const card=h=>`<article class="card"><div class="img" style="background-image:${bg(h)}">${h.image?'':h.icon}<span class="r">★ ${h.rating}</span></div><div class="body"><h3>${esc(h.name)}</h3><div class="muted">📍 ${esc(h.location)} · ${h.reviews} reviews</div><p class="muted">${esc(h.description)}</p><div class="tags">${h.facilities.map(f=>`<i>${esc(f)}</i>`).join('')}</div><div class="row"><div class="price">${pk(h.price)}<small> /night</small></div></div><div class="row"><a class="btn out" href="#/hotel/${h.id}">View Details</a><a class="btn" href="#/book/${h.id}${SP}">Book Now</a></div></div></article>`;
let SP='';
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
function home(){
 const cities=[...new Set(HOTELS.map(h=>h.city))];
 return `<section class="hero"><div class="wrap"><h1>Discover Your Perfect Stay in Pakistan</h1><p>From Lahore's heritage to Hunza's peaks — handpicked hotels, simple booking.</p><a class="btn alt" href="#/hotels">Explore Hotels</a></div></section>
 <div class="wrap"><form class="search" id="sf"><div><label>Destination</label><select id="q"><option value="">All destinations</option>${cities.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Check-in</label><input type="date" id="ci" min="${today()}" value="${addDays(today(),1)}"></div><div><label>Check-out</label><input type="date" id="co" min="${today()}" value="${addDays(today(),3)}"></div><div><label>Guests</label><select id="g">${[1,2,3,4,5,6].map(n=>`<option ${n==2?'selected':''}>${n}</option>`).join('')}</select></div><button class="btn" type="submit">Search Hotels</button></form></div>
 <section><div class="wrap"><div class="title"><h2>Popular Hotels</h2><p>Guest favourites across the country</p></div><div class="grid">${HOTELS.slice(0,3).map(card).join('')}</div></div></section>
 <section style="padding-top:0"><div class="wrap"><div class="title"><h2>Popular Destinations</h2><p>Where will you wake up next?</p></div><div class="dest">${cities.map(c=>{const h=HOTELS.find(x=>x.city===c);return `<a href="#/hotels?q=${c}" style="background-image:${cbg(c,h)};background-size:cover;background-position:center"><b>${c}</b><small>${HOTELS.filter(x=>x.city===c).length} hotel(s)</small></a>`}).join('')}</div></div></section>
 <section style="padding-top:0"><div class="wrap why"><div class="title"><h2>Why Choose SafarGo</h2></div><div class="grid">${[['🏷️','Best Price','Honest nightly rates, no hidden fees.'],['✅','Verified Hotels','Every stay is handpicked and reviewed.'],['🕐','Instant Booking','Confirm your stay in under a minute.'],['💬','Friendly Support','Real people ready to help.']].map(x=>`<div class="it"><div>${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div></section>
 <section style="padding-top:0"><div class="wrap"><div class="title"><h2>Guest Reviews</h2></div><div class="grid">${R.map(r=>`<div class="card rev"><div>${rs(r[1])}</div><p>“${r[2]}”</p><b>${r[0]}</b></div>`).join('')}</div></div></section>`;
}
function hotels(q){
 const city=q.get('q')||'',g=+q.get('g')||0;
 const list=HOTELS.filter(h=>!city||h.city.toLowerCase()===city.toLowerCase());
 return `<div class="wrap pg"><div class="title"><h2>${city?esc(city)+' Hotels':'All Hotels'}</h2><p>${list.length} stay(s) found${city?` · <a href="#/hotels" style="text-decoration:underline">clear filter</a>`:''}</p></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<p style="text-align:center">No hotels match your search.</p>'}</div>`;
}
function detail(id){
 const h=get(id);if(!h)return nf();
 return `<div class="wrap pg"><a href="#/hotels" class="muted">← Back to hotels</a><div class="gal" style="margin:16px 0 28px"><div class="big" style="background-image:${bg(h)}"></div><div style="background-image:${bg(h)};filter:brightness(1.2)"></div><div style="background-image:${bg(h)};filter:brightness(.8)"></div></div>
 <div class="two"><div><h1>${esc(h.name)}</h1><p class="muted">📍 ${esc(h.location)} · ${rs(h.rating)} ${h.rating} (${h.reviews} reviews)</p><p style="margin:14px 0">${esc(h.description)}</p><h3>Facilities</h3><div class="tags" style="margin:8px 0 22px">${h.facilities.map(f=>`<i>${esc(f)}</i>`).join('')}</div><h3>Rooms</h3>${h.rooms.map(r=>`<div class="panel" style="margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px"><b>${esc(r[0])}</b><span class="price">${pk(r[1])}<small> /night</small></span></div>`).join('')}<h3 style="margin-top:22px">Reviews</h3>${R.map(r=>`<div class="panel" style="margin:10px 0"><div>${rs(r[1])} <b>${r[0]}</b></div><p>${r[2]}</p></div>`).join('')}</div>
 <aside><div class="panel" style="position:sticky;top:20px"><div class="price">${pk(h.price)}<small> /night</small></div><p class="muted" style="margin:8px 0 16px">Free cancellation up to 48 hours before check-in.</p><a class="btn" style="width:100%;text-align:center" href="#/book/${h.id}${SP}">Book Now</a></div></aside></div></div>`;
}
let curBook=null;
function book(id,q){
 const h=get(id);if(!h)return nf();
 const ci=q.get('ci')||addDays(today(),1),co=q.get('co')||addDays(today(),3);
 return `<div class="wrap pg"><div class="title"><h2>Complete Your Booking</h2></div><div class="two"><form class="panel" id="bf" novalidate><h3>Guest Details</h3>
 <div class="f"><label>Hotel</label><select id="hid">${HOTELS.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.name)} – ${esc(x.city)}</option>`).join('')}</select></div>
 <div class="f"><label>Room Type</label><select id="rt"></select></div>
 <div class="f"><label>Full Name</label><input id="nm" required maxlength="80"></div>
 <div class="f2"><div class="f"><label>Email</label><input id="em" type="email" required></div><div class="f"><label>Phone</label><input id="ph" type="tel" required placeholder="03xx xxxxxxx"></div></div>
 <div class="f2"><div class="f"><label>Check-in</label><input id="bci" type="date" min="${today()}" value="${ci}"></div><div class="f"><label>Check-out</label><input id="bco" type="date" min="${today()}" value="${co}"></div></div>
 <div class="f2"><div class="f"><label>Guests</label><select id="bg">${[1,2,3,4,5,6,7,8].map(n=>`<option ${n==(+q.get('g')||2)?'selected':''}>${n}</option>`).join('')}</select></div><div class="f"><label>Rooms</label><select id="br">${[1,2,3,4].map(n=>`<option>${n}</option>`).join('')}</select></div></div>
 <div class="f"><label>Special Request (optional)</label><textarea id="sr" rows="3" maxlength="400"></textarea></div><div class="err" id="er"></div><button class="btn" id="sbm" type="submit" style="width:100%">Confirm Booking</button></form>
 <div class="panel sum" id="sm" style="align-self:start"></div></div></div>`;
}
function calc(){
 const h=get($('#hid').value),r=h.rooms.find(x=>x[0]===$('#rt').value)||h.rooms[0];
 const n=Math.round((new Date($('#bco').value)-new Date($('#bci').value))/864e5),rooms=+$('#br').value;
 const total=n>0?n*rooms*r[1]:0;
 $('#sm').innerHTML=`<h3>Booking Summary</h3><div><span>Hotel</span><b>${esc(h.name)}</b></div><div><span>Room</span><span>${esc(r[0])}</span></div><div><span>Rate</span><span>${pk(r[1])}/night</span></div><div><span>Nights</span><span>${n>0?n:'–'}</span></div><div><span>Rooms</span><span>${rooms}</span></div><div class="t"><span>Total</span><span>${pk(total)}</span></div>`;
 return{h,r,n,rooms,total};
}
function bindBook(){
 const fill=()=>{const h=get($('#hid').value);$('#rt').innerHTML=h.rooms.map(r=>`<option>${esc(r[0])}</option>`).join('');calc()};
 fill();$('#hid').onchange=fill;
 ['rt','bci','bco','br'].forEach(i=>$('#'+i).onchange=calc);
 $('#bci').onchange=()=>{if($('#bco').value<=$('#bci').value)$('#bco').value=addDays($('#bci').value,1);calc()};
 $('#bf').onsubmit=async e=>{e.preventDefault();
  const{h,r,n,rooms,total}=calc(),er=$('#er');er.textContent='';
  const nm=$('#nm').value.trim(),em=$('#em').value.trim(),ph=$('#ph').value.trim();
  if(nm.length<2)return er.textContent='Please enter your full name.';
  if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent='Please enter a valid email.';
  if(!/^[+\d][\d\s-]{6,}$/.test(ph))return er.textContent='Please enter a valid phone number.';
  if(n<1)return er.textContent='Check-out must be after check-in.';
  const b={ref:'SG-'+Date.now().toString(36).toUpperCase().slice(-6),hotel:h.name,hotel_id:h.id,room:r[0],name:nm,email:em,phone:ph,ci:$('#bci').value,co:$('#bco').value,guests:+$('#bg').value,rooms,total,status:'Confirmed',note:$('#sr').value.trim()};
  $('#sbm').disabled=true;$('#sbm').textContent='Confirming…';
  try{
   if(sb){const uid=crypto.randomUUID();
    let x=await sb.from('users').insert({id:uid,full_name:nm,email:em,phone:ph});if(x.error)throw x.error;
    x=await sb.from('bookings').insert({booking_ref:b.ref,user_id:uid,hotel_id:h.id,hotel_name:h.name,room_type:r[0],check_in:b.ci,check_out:b.co,guests:b.guests,rooms,total_price:total,special_request:b.note,status:'confirmed'});if(x.error)throw x.error;}
   const all=JSON.parse(localStorage.getItem('sg_bookings')||'[]');all.push(b);localStorage.setItem('sg_bookings',JSON.stringify(all));
   location.hash='#/confirm/'+b.ref;
  }catch(err){console.error(err);er.textContent='Booking failed: '+(err.message||'please try again.');$('#sbm').disabled=false;$('#sbm').textContent='Confirm Booking'}
 };
}
function confirm(ref){
 let b;try{b=JSON.parse(localStorage.getItem('sg_bookings')||'[]').find(x=>x.ref===ref)}catch(e){}
 if(!b)return nf();
